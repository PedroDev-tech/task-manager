<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="500" height="500" viewBox="0 0 500 500" xml:space="preserve">
<defs>
  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4CE8EC"/>
    <stop offset="0.35" stop-color="#2DDCE1"/>
    <stop offset="0.7" stop-color="#18C7D4"/>
    <stop offset="1" stop-color="#0FA9B0"/>
  </linearGradient>
  <linearGradient id="ringGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4CE8EC"/>
    <stop offset="1" stop-color="#2DDCE1"/>
  </linearGradient>
</defs>

<!-- Outer white rim around ring (full circle, closing the gap) -->
<path d="M 250 16 A 234 234 0 1 1 250 484"
      fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.95"/>
<!-- White rim closing the top to complete the circle -->
<line x1="218" y1="18" x2="282" y2="18" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

<!-- Ring (thick circle with open top) -->
<path d="M 250 50 A 200 200 0 1 1 250 450"
      fill="none" stroke="url(#ringGrad)" stroke-width="62" stroke-linecap="butt"/>

<!-- T stem (vertical) - aligned with the opening at top -->
<rect x="218" y="50" width="64" height="320" rx="6" fill="url(#ringGrad)"/>

<!-- T bar (horizontal) at top of ring -->
<rect x="125" y="92" width="250" height="64" rx="8" fill="url(#ringGrad)"/>

<!-- White outline around T bar + stem -->
<g fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.75" stroke-linejoin="round">
  <rect x="125" y="92" width="250" height="64" rx="8"/>
  <rect x="218" y="50" width="64" height="320" rx="6"/>
</g>

</svg>
