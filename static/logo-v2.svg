<ellipse cx="250" cy="320" rx="175" ry="245" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.95"/>
<ellipse cx="250" cy="320" rx="168" ry="238" fill="#0B2430"/>

<!-- Letter T (flat white, rounded) -->
